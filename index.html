<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Leave Tracker</title>

<meta name="theme-color" content="#F6F5F1" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Leaves" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ── Sign-in screen (the "app lock") ───────────────────────────────── -->
<section id="screen-login" class="screen screen-login" aria-hidden="false">
  <div class="login-mark" aria-hidden="true">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
      <path d="M7 17.6L13.5 24 27 9" stroke="#F6F5F1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1 class="login-title">Leave Tracker</h1>
  <p class="login-sub">Sign in to see and add to your leave sheet.</p>
  <button id="btn-signin" class="btn btn-primary">Sign in with Google</button>
  <p id="login-error" class="login-error" hidden></p>
</section>

<!-- ── App shell (shown once signed in) ──────────────────────────────── -->
<div id="app" class="app" hidden>

  <header class="topbar">
    <span class="topbar-title" id="topbar-title">Overview</span>
    <button id="btn-signout" class="icon-btn" aria-label="Sign out" title="Sign out">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M7 2H3.8A1.8 1.8 0 0 0 2 3.8v10.4A1.8 1.8 0 0 0 3.8 16H7M12 12.5 16 9l-4-3.5M16 9H6.5"
          stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <!-- ── Overview page ── -->
  <main id="page-overview" class="page">

    <section class="hero-stat">
      <span class="hero-number" id="expiring-count">–</span>
      <span class="hero-label" id="expiring-label">comp-offs expiring soon</span>
    </section>

    <section class="panel">
      <h2 class="panel-title">Leave balance</h2>
      <div id="bars" class="bars" aria-hidden="false">
        <!-- bar rows injected by app.js -->
      </div>
    </section>

    <section class="panel">
      <h2 class="panel-title">Comp. off</h2>
      <div class="kv-row">
        <span class="kv-label">Extra days worked</span>
        <span class="kv-value" id="comp-worked">–</span>
      </div>
      <div class="kv-row">
        <span class="kv-label">Taken so far</span>
        <span class="kv-value" id="comp-taken">–</span>
      </div>
      <div class="kv-row kv-emph">
        <span class="kv-label">Available</span>
        <span class="kv-value" id="comp-available">–</span>
      </div>
    </section>

    <p id="overview-empty" class="empty-note" hidden>Nothing logged yet — add your first entry below.</p>
    <p id="overview-error" class="error-note" hidden></p>

  </main>

  <!-- ── Add entry page ── -->
  <main id="page-add" class="page" hidden>

    <div class="segmented" role="tablist" aria-label="Entry type">
      <button class="segmented-opt is-active" id="seg-leave" role="tab" aria-selected="true">Leave taken</button>
      <button class="segmented-opt" id="seg-extra" role="tab" aria-selected="false">Extra day worked</button>
    </div>

    <form id="form-leave" class="entry-form">
      <label class="field">
        <span class="field-label">Date</span>
        <input type="date" id="leave-date" required />
      </label>
      <label class="field">
        <span class="field-label">Leave type</span>
        <select id="leave-type" required>
          <option value="Sick Leave">Sick Leave</option>
          <option value="Casual Leave">Casual Leave</option>
          <option value="Priviledge Leave">Privilege Leave</option>
          <option value="Comp. Off">Comp. Off</option>
        </select>
      </label>
      <label class="field" id="field-comp-daytype" hidden>
        <span class="field-label">Comp. off type</span>
        <select id="leave-comp-daytype">
          <option value="Full Day">Full day</option>
          <option value="Half Day">Half day</option>
        </select>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Save entry</button>
    </form>

    <form id="form-extra" class="entry-form" hidden>
      <label class="field">
        <span class="field-label">Date worked</span>
        <input type="date" id="extra-date" required />
      </label>
      <label class="field">
        <span class="field-label">Day type</span>
        <select id="extra-daytype" required>
          <option value="Full Day">Full day</option>
          <option value="Half Day">Half day</option>
        </select>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Save entry</button>
    </form>

    <p id="add-error" class="error-note" hidden></p>

  </main>

  <nav class="tabbar">
    <button class="tab is-active" id="tab-overview" aria-label="Overview">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <rect x="3" y="10" width="3.2" height="7" rx="0.8" stroke="currentColor" stroke-width="1.3"/>
        <rect x="8.4" y="6" width="3.2" height="11" rx="0.8" stroke="currentColor" stroke-width="1.3"/>
        <rect x="13.8" y="3" width="3.2" height="14" rx="0.8" stroke="currentColor" stroke-width="1.3"/>
      </svg>
      <span>Overview</span>
    </button>
    <button class="tab" id="tab-add" aria-label="Add entry">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M10 3.5v13M3.5 10h13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span>Add entry</span>
    </button>
  </nav>

</div>

<!-- ── Save confirmation toast ── -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
